name: thoyyiba_app
description: A premium single-brand lifestyle commerce ecosystem.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  google_fonts: ^6.2.1
  share_plus: ^13.3.0
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  shared_preferences: ^2.5.5
  google_sign_in: 6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  assets:
    - assets/images/
  uses-material-design: true

  fonts:
    - family: Nura
      fonts:
        - asset: assets/fonts/Nura/Nura-Thin.ttf
          weight: 100
        - asset: assets/fonts/Nura/Nura-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Nura/Nura-Light.ttf
          weight: 300
        - asset: assets/fonts/Nura/Nura-Normal.ttf
          weight: 400
        - asset: assets/fonts/Nura/Nura-Medium.ttf
          weight: 500
        - asset: assets/fonts/Nura/Nura-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nura/Nura-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nura/Nura-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Nura/Nura-Black.ttf
          weight: 900



